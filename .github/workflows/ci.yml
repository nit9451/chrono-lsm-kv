name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build Release Binary
      run: cargo build --release --verbose
    - name: Run ChronoLSM-KV Unit Tests
      run: cargo test --verbose
